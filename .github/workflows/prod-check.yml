name: Production check

# The live site, daily: the e2e suite and Lighthouse budgets against https://yevl.dev, and every
# link on both locales. Catches what CI cannot: a bad deploy, a header or CDN change, a dead link.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prod-check.yml
      - lighthouserc.prod.json

permissions:
  contents: read

concurrency:
  group: prod-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://yevl.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e against production
        run: pnpm e2e
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
      - name: Lighthouse budgets against production
        if: ${{ !cancelled() }}
        run: pnpm exec lhci autorun --config=lighthouserc.prod.json
      # LinkedIn answers every bot with 999; the e2e suite pins the exact profile URL instead.
      - name: Links
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments --exclude 'linkedin\.com' https://yevl.dev/ https://yevl.dev/uk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: prod-check-results
          path: |
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
