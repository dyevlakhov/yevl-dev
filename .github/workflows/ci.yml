name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Private copy-rule patterns (tests/guard-terms.ts). Forks get no secrets, so their PRs skip
      # those tests; everywhere else an empty secret would skip them silently, so fail instead.
      # Dependabot PRs read the copy in the repo's Dependabot secrets.
      - name: Require GUARD_TERMS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
        run: |
          if [ -z "$GUARD_TERMS" ]; then
            echo "::error::GUARD_TERMS secret is empty (Actions secrets, or Dependabot secrets for Dependabot PRs)"
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
      - run: pnpm build
      - name: JS bundle budget
        run: pnpm test tests/unit/bundle.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
      - name: Lighthouse budgets
        run: pnpm lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  # Workflow correctness (actionlint) and security (zizmor: injection, credential leaks,
  # unpinned or impostor actions, Dependabot cooldown).
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        run: pipx run zizmor==1.32.0 --format=github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  # New dependencies with known vulnerabilities or a disallowed licence fail the PR.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
