name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Private copy-rule patterns (tests/guard-terms.ts); the tests that need them skip without it.
      - run: pnpm test
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
      - run: pnpm build
      - name: JS bundle budget
        run: pnpm test tests/unit/bundle.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
      - name: Lighthouse budgets
        run: pnpm lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
