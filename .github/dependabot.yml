version: 2
updates:
  # Monthly and grouped, so updates arrive as a few PRs that CI (budgets included) can vet.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A release has to be a week old before Dependabot proposes it (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime (.nvmrc, CI); move them with the runtime, not ahead of it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
